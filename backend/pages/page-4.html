<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/figr-bridge.js"></script>
    <title>Activity feed</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #111827; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: #6b7280; font-size: 13px; margin: 0 0 20px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
      .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; flex-shrink: 0; }
      .text { flex: 1; font-size: 14px; }
      .time { color: #9ca3af; font-size: 12px; }
      .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #4338ca; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Activity</h1>
      <p class="sub">Live. New events arrive every 2 seconds; the oldest drop off after 25.</p>
      <ul id="feed" data-name="Activity list"></ul>
    </div>

    <script>
      (() => {
        const people = ["Ada", "Grace", "Linus", "Margaret", "Alan", "Barbara", "Ken", "Radia"];
        const verbs = ["commented on", "approved", "closed", "reopened", "assigned", "shipped"];
        const things = ["Checkout redesign", "Onboarding v2", "Pricing page", "Mobile nav", "Billing export"];
        const colors = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899"];
        const MAX = 25;

        let nextId = 1;
        const items = [];

        function makeItem() {
          const id = nextId++;
          return {
            id,
            who: people[id % people.length],
            verb: verbs[id % verbs.length],
            what: things[id % things.length],
            color: colors[id % colors.length],
            keyed: id % 2 === 1,
            born: Date.now(),
          };
        }

        function ago(ms) {
          const s = Math.round(ms / 1000);
          return s < 60 ? `${s}s ago` : `${Math.floor(s / 60)}m ago`;
        }

        // Rebuilds every node from scratch on each tick, like a naive template render.
        function render() {
          const now = Date.now();
          document.getElementById("feed").innerHTML = items
            .map(
              (it) => `
              <li${it.keyed ? ` data-key="activity-${it.id}"` : ""}>
                <span class="avatar" style="background:${it.color}">${it.who.slice(0, 2)}</span>
                <span class="text"><b>${it.who}</b> ${it.verb} <span class="tag">${it.what}</span></span>
                <span class="time">${ago(now - it.born)}</span>
              </li>`,
            )
            .join("");
        }

        for (let i = 0; i < 8; i++) items.unshift(makeItem());
        render();

        setInterval(() => {
          items.unshift(makeItem());
          if (items.length > MAX) items.pop();
          render();
        }, 2000);
      })();
    </script>
  </body>
</html>
