<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/figr-bridge.js"></script>
    <title>Sign up</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #eef2f7; color: #0f172a; min-height: 100vh; display: grid; place-items: center; }
      .card { width: 420px; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .sub { color: #64748b; margin: 0 0 24px; font-size: 14px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
      input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      .check { display: flex; gap: 8px; align-items: center; margin-top: 16px; font-size: 13px; }
      button[type="submit"] { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; }
      button[disabled] { background: #94a3b8; cursor: not-allowed; }
      .foot { margin-top: 16px; font-size: 13px; text-align: center; color: #64748b; }
      .foot a { color: #2563eb; }
    </style>
  </head>
  <body>
    <main class="card" data-name="Sign-up card">
      <h1>Create your account</h1>
      <p class="sub">Free for 14 days. No card needed.</p>

      <form id="signup" action="page-2.html" method="get" data-key="signup-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="name" type="text" placeholder="Ada Lovelace" data-key="signup-name" />

        <label for="email">Work email</label>
        <input id="email" name="email" type="email" placeholder="ada@company.com" data-key="signup-email" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 12 characters" />

        <div class="check">
          <input id="terms" type="checkbox" />
          <label for="terms" style="margin: 0; font-weight: 400">I agree to the terms</label>
        </div>

        <button type="submit" disabled data-key="signup-submit" data-name="Create account">Create account</button>
      </form>

      <p class="foot">Already have an account? <a href="page-1.html" data-key="signup-login-link">Log in</a></p>
    </main>
  </body>
</html>
